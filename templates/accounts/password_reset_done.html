<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check your email</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { align-items: center; background: #e8edf3; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 1rem; }
        .card { background: #fff; border-radius: 18px; box-shadow: 0 20px 50px rgba(0, 7, 45, .15); max-width: 440px; padding: 2.5rem; text-align: center; width: 100%; }
        h1 { color: #00072D; font-size: 1.65rem; margin: 0 0 .75rem; }
        p { color: #52606d; line-height: 1.55; }
        a { color: #123499; display: inline-block; font-weight: 700; margin-top: 1rem; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Check your email</h1>
        <p>If an account exists for that email address, a password-reset link has been sent.</p>
        <a href="{% url 'signin' %}">Return to sign in</a>
    </main>
</body>
</html>
