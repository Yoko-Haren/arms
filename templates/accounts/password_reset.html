<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { align-items: center; background: #e8edf3; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 1rem; }
        .card { background: #fff; border-radius: 18px; box-shadow: 0 20px 50px rgba(0, 7, 45, .15); max-width: 440px; padding: 2.5rem; width: 100%; }
        h1 { color: #00072D; font-size: 1.65rem; margin: 0 0 .75rem; }
        p { color: #52606d; line-height: 1.55; }
        .error { background: #fff2f2; border-left: 4px solid #c53030; color: #9b2c2c; margin: 1rem 0; padding: .75rem 1rem; }
        label { color: #2d3748; display: block; font-weight: 600; margin: 1.5rem 0 .5rem; }
        input { border: 1px solid #cbd5e0; border-radius: 9px; font-size: 1rem; padding: .8rem; width: 100%; }
        button { background: #123499; border: 0; border-radius: 9px; color: #fff; cursor: pointer; font-size: 1rem; font-weight: 700; margin-top: 1.25rem; padding: .85rem; width: 100%; }
        button:hover { background: #051650; }
        a { color: #123499; display: inline-block; margin-top: 1.25rem; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Reset your password</h1>
        <p>Enter your account email address and we will send a password-reset link.</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="id_email">Email address</label>
            <input id="id_email" name="email" type="email" value="{{ email }}" autocomplete="email" required>
            <button type="submit">Send reset link</button>
        </form>
        <a href="{% url 'signin' %}">Return to sign in</a>
    </main>
</body>
</html>
