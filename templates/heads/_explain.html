<button type="button" class="explain-toggle" id="explainToggle" aria-pressed="false" title="Show or hide the explanations on School Head pages">
    <i class="fi fi-rr-info" aria-hidden="true"></i><span>Show details</span>
</button>
<script>
(function () {
    // Explanations (hints, footnotes, level meanings, method notes) stay hidden until asked for; the choice is remembered.
    var button = document.getElementById('explainToggle'), root = document.documentElement;
    function sync() {
        var on = root.dataset.explain === 'on';
        button.setAttribute('aria-pressed', on ? 'true' : 'false');
        button.querySelector('span').textContent = on ? 'Hide details' : 'Show details';
    }
    button.addEventListener('click', function () {
        root.dataset.explain = root.dataset.explain === 'on' ? 'off' : 'on';
        try { localStorage.setItem('arms-explain', root.dataset.explain); } catch (e) { /* private mode: this page only */ }
        sync();
    });
    sync();
})();
</script>
