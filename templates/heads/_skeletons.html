{# Skeleton screens for the School Head portal, shown by static/heads/js/head-skeleton.js while the next page loads. #}
{# Each outline follows its page's layout; [data-skel-filter] is dropped when a filter change keeps the real filter bar. #}

<template id="skel-dashboard">
<div class="skel-page" role="status" aria-label="Loading the Academic Dashboard">
    <span class="sr-only">Loading the Academic Dashboard</span>
    <div class="skel-card" data-skel-filter>
        <div class="skel-row"><span class="skel skel-input"></span><span class="skel skel-input grow"></span><span class="skel skel-input"></span><span class="skel skel-input" style="flex-basis:230px"></span></div>
        <span class="skel skel-line sm w-40"></span>
    </div>
    <div class="skel-grid g-2-1" style="align-items:start">
        <div style="display:flex;flex-direction:column;gap:1rem;min-width:0">
            <div class="skel-card">
                <span class="skel skel-line sm w-50"></span>
                <div class="skel-row"><span class="skel skel-badge"></span>
                    <div style="flex:1;display:flex;flex-direction:column;gap:.5rem"><span class="skel skel-big"></span><span class="skel skel-line w-90"></span><span class="skel skel-line w-60"></span></div></div>
                <div class="skel-grid g-4">{% for _ in "1234" %}<span class="skel skel-fact"></span>{% endfor %}</div>
                <div class="skel-grid g-5">{% for _ in "12345" %}<span class="skel skel-fact" style="height:7.5rem"></span>{% endfor %}</div>
            </div>
            <div class="skel-card"><span class="skel skel-title w-40"></span><span class="skel skel-line sm w-70"></span><span class="skel skel-chart"></span></div>
        </div>
        <div class="skel-card">
            <div class="skel-row"><span class="skel skel-circle" style="width:42px;height:42px;border-radius:12px"></span><div style="flex:1;display:flex;flex-direction:column;gap:.45rem"><span class="skel skel-title w-60"></span><span class="skel skel-line sm w-90"></span></div></div>
            <div class="skel-list">{% for _ in "12345" %}<span class="skel skel-item" style="height:3.2rem"></span>{% endfor %}</div>
        </div>
    </div>
</div>
</template>

<template id="skel-performance">
<div class="skel-page" role="status" aria-label="Loading School Performance">
    <span class="sr-only">Loading School Performance</span>
    <div class="skel-card" data-skel-filter>
        <div class="skel-row"><span class="skel skel-input" style="flex-basis:230px"></span><span class="skel skel-input"></span><span class="skel skel-input"></span></div>
        <span class="skel skel-line sm w-40"></span>
    </div>
    <div class="skel-grid g-2-1">
        <div class="skel-card">
            <span class="skel skel-line sm w-50"></span>
            <span class="skel skel-big" style="width:45%"></span>
            <span class="skel skel-line" style="height:1.1rem;border-radius:20px"></span>
            <div class="skel-grid g-3">{% for _ in "123" %}<span class="skel skel-fact"></span>{% endfor %}</div>
            <div class="skel-grid g-3">{% for _ in "123" %}<span class="skel skel-fact"></span>{% endfor %}</div>
        </div>
        <div class="skel-card">
            <span class="skel skel-title w-60"></span><span class="skel skel-line sm w-90"></span>
            <div class="skel-table">{% for _ in "12345" %}<div class="skel-tr"><span class="skel skel-line w-60"></span><span class="skel skel-line w-40"></span><span class="skel skel-line w-40"></span></div>{% endfor %}</div>
        </div>
    </div>
    <div class="skel-card"><span class="skel skel-title w-40"></span><span class="skel skel-line sm w-70"></span><span class="skel skel-chart"></span></div>
    <div class="skel-card">
        <span class="skel skel-title w-20"></span>
        <div class="skel-table">{% for _ in "123456" %}<div class="skel-tr"><span class="skel skel-line w-50"></span><span class="skel skel-line w-40"></span><span class="skel skel-line" style="height:.8rem"></span><span class="skel skel-line w-30"></span><span class="skel skel-line w-30"></span></div>{% endfor %}</div>
    </div>
    <div class="skel-card"><span class="skel skel-title w-40"></span><span class="skel skel-chart"></span></div>
</div>
</template>

<template id="skel-users">
<div class="skel-page" role="status" aria-label="Loading User Management">
    <span class="sr-only">Loading User Management</span>
    <div class="skel-grid g-4">{% for _ in "1234" %}<span class="skel skel-tile" style="height:5.6rem"></span>{% endfor %}</div>
    <div class="skel-card">
        <div class="skel-row" style="justify-content:space-between"><span class="skel skel-title w-20"></span><span class="skel skel-pill" style="width:12rem;height:2rem"></span></div>
        <div class="skel-row"><span class="skel skel-input"></span><span class="skel skel-input"></span><span class="skel skel-input"></span><span class="skel skel-input grow"></span></div>
        <div class="skel-table">{% for _ in "12345678" %}<div class="skel-tr"><span class="skel-row" style="flex-wrap:nowrap"><span class="skel skel-circle"></span><span class="skel skel-line w-60"></span></span><span class="skel skel-line w-80"></span><span class="skel skel-line w-50"></span><span class="skel skel-pill"></span><span class="skel skel-pill" style="width:4rem"></span></div>{% endfor %}</div>
    </div>
</div>
</template>

<template id="skel-settings">
<div class="skel-page" role="status" aria-label="Loading Account Settings">
    <span class="sr-only">Loading Account Settings</span>
    <div class="skel-grid g-1-1">
        {% for _ in "1234" %}
        <div class="skel-card">
            <span class="skel skel-title w-30"></span>
            <div class="skel-grid g-1-1"><span class="skel skel-input" style="flex:none;width:100%"></span><span class="skel skel-input" style="flex:none;width:100%"></span></div>
            <span class="skel skel-input" style="flex:none;width:100%"></span>
            <span class="skel skel-pill" style="width:8rem;height:2.2rem;border-radius:10px"></span>
        </div>
        {% endfor %}
    </div>
</div>
</template>

<template id="skel-generic">
<div class="skel-page" role="status" aria-label="Loading">
    <span class="sr-only">Loading</span>
    <div class="skel-card"><span class="skel skel-title w-30"></span><span class="skel skel-line w-70"></span></div>
    <div class="skel-card">{% for _ in "123456" %}<span class="skel skel-line"></span>{% endfor %}</div>
</div>
</template>
